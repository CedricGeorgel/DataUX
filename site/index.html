<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réseau des fiches · Ressources partagées</title>
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/graph.css">
</head>
<body data-mode="full">
<div id="graph"><svg id="svg" role="img" aria-label="Graphe des relations entre les fiches"></svg></div>
<div class="bar">
  <input id="q" type="search" placeholder="Chercher une fiche…" aria-label="Chercher une fiche" list="names">
  <datalist id="names"></datalist>
  <div class="fwrap">
    <button class="btn" id="filterBtn" aria-expanded="false" aria-controls="filters">Filtres <span id="fcount" class="muted"></span> ▾</button>
    <div class="pop" id="filters" role="group" aria-label="Filtres">
      <h4>Bases</h4>
      <div class="row" id="chips"></div>
      <h4>Affichage</h4>
      <div class="row">
        <button class="chip" id="isoBtn" aria-pressed="true">Fiches isolées</button>
        <button class="chip" id="sugBtn" aria-pressed="true"><span class="sw conf"></span>Confusions</button>
      </div>
    </div>
  </div>
</div>
<button class="chev" id="panelBtn" aria-expanded="true" aria-controls="panel" aria-label="Masquer le panneau" title="Masquer le panneau"><svg class="tab" viewBox="0 0 29 64" width="29" height="64" aria-hidden="true"><path class="fill" d="M29 0A9 9 0 0 1 20 9H9.5A9 9 0 0 0 .5 18V46A9 9 0 0 0 9.5 55H20A9 9 0 0 1 29 64Z"/><path class="edge" d="M28.5 .5A8.5 8.5 0 0 1 20 9.5H9.5A9 9 0 0 0 .5 18.5V45.5A9 9 0 0 0 9.5 54.5H20A8.5 8.5 0 0 1 28.5 63"/></svg><svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<aside id="panel" aria-live="polite"></aside>
<section class="win fiche-win open collapsed" id="win" aria-label="Fiche">
  <div class="whead" data-toggle>
    <span class="sw"></span><span class="wt">Fiche</span>
    <button class="ib" data-collapse aria-expanded="false" aria-controls="ficheBody" aria-label="Déplier la fiche" title="Déplier">▸</button>
    <button class="ib x" data-close aria-label="Fermer la fiche" title="Fermer">✕</button>
  </div>
  <div class="wbody" id="ficheBody"><p class="muted">Clique sur un point pour lire sa fiche.</p></div>
</section>
<button class="res-btn" id="resBtn" aria-controls="panel" hidden><span class="sw"></span><span class="wt">Ressources</span><span class="go" aria-hidden="true">›</span></button>
<section class="win legend-win open" id="legendWin" aria-label="Légende">
  <div class="whead">
    <span class="wt">Légende</span>
    <button class="ib" data-collapse aria-expanded="true" aria-label="Replier la légende" title="Replier">▾</button>
  </div>
  <div class="wbody"></div>
</section>
<script src="assets/d3.min.js"></script>
<script src="assets/graph.js"></script>
</body>
</html>
